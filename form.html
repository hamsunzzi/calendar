<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>신청서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--p:#e8789a;--pl:#fdeef3;--pb:#f6c9d7;--t:#4a3a40;--s:#8a7a80;--dark:#4a3a40}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--t);word-break:keep-all;padding:4px}
.card{background:#fff;border:1px solid var(--pb);border-radius:18px;padding:22px 20px;max-width:732px;margin:0 auto}
.intro{font-size:14px;color:var(--s);line-height:1.6;margin-bottom:18px}
.f{margin-bottom:18px}
.lab{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin-bottom:8px}
.num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--p);color:#fff;font-size:12px;font-weight:800;flex:none}
.req{font-size:11px;font-weight:700;color:var(--p)}
.opt{font-size:11px;font-weight:600;color:var(--s)}
input[type=text],textarea{width:100%;border:1px solid var(--pb);border-radius:12px;padding:11px 13px;font:inherit;font-size:14px;color:var(--t);background:#fffafc;outline:none;resize:vertical}
input[type=text]:focus,textarea:focus{border-color:var(--p);background:#fff}
textarea{min-height:76px;line-height:1.6}
::placeholder{color:#c2b5ba}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{cursor:pointer}
.chips input{display:none}
.chips span{display:inline-block;border:1px solid var(--pb);border-radius:999px;padding:8px 14px;font-size:13px;background:#fff;transition:.15s}
.chips input:checked+span{background:var(--p);border-color:var(--p);color:#fff;font-weight:700}
.agree{display:flex;gap:10px;align-items:flex-start;background:var(--pl);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6;cursor:pointer}
.agree input{margin-top:3px;accent-color:var(--p);width:16px;height:16px;flex:none}
.est{display:flex;justify-content:space-between;align-items:center;background:var(--pl);border-radius:14px;padding:14px 16px;margin:6px 0 14px}
.est b{font-size:22px;color:var(--p)}
.est small{display:block;font-size:12px;color:var(--s);margin-top:2px}
.btns{display:flex;gap:8px}
button{font:inherit;border:0;cursor:pointer;border-radius:14px}
#copy{flex:1;background:var(--p);color:#fff;font-size:16px;font-weight:800;padding:15px}
#copy:hover{filter:brightness(.96)}
#reset{background:#fff;border:1px solid var(--pb);color:var(--s);font-size:14px;padding:0 18px}
.msg{text-align:center;font-size:13px;margin-top:10px;min-height:20px;color:var(--s)}
.msg.ok{color:var(--p);font-weight:700}
.msg.err{color:#c0392b;font-weight:700}
#out{display:none;margin-top:10px;font-size:13px;min-height:160px}
</style>
</head>
<body>
<div class="card">
<p class="intro">아래 칸을 채우고 <b>신청서 복사하기</b>를 누른 뒤, 페이지의 <b>'작가에게 문의'</b>에 붙여넣어 주세요.<br>모르는 칸은 비워두셔도 괜찮아요. 상담하면서 함께 정해요!</p>

<div class="f"><div class="lab"><span class="num">1</span>방송 닉네임<span class="req">필수</span></div>
<input type="text" id="nick" placeholder="데뷔 전이라면 예정 닉네임을 적어주세요"></div>

<div class="f"><div class="lab"><span class="num">2</span>방송 플랫폼 · 채널 링크<span class="opt">선택</span></div>
<input type="text" id="ch" placeholder="예) 치지직 / 아직 데뷔 전"></div>

<div class="f"><div class="lab"><span class="num">3</span>베이스 모델<span class="req">필수</span></div>
<input type="text" id="base" placeholder="예) 마누카 (다른 모델이면 Booth 링크도 함께)"></div>

<div class="f"><div class="lab"><span class="num">4</span>의상 · 헤어 · 액세서리 Booth 링크<span class="opt">선택</span></div>
<textarea id="parts" placeholder="정한 파츠가 있다면 링크를 적어주세요.&#10;아직 없다면 '추천 원해요'라고 적어주시면 골라드려요."></textarea></div>

<div class="f"><div class="lab"><span class="num">5</span>원하는 색 · 분위기 · 커스텀<span class="opt">선택</span></div>
<textarea id="custom" placeholder="머리색, 눈색, 의상색, 원하는 분위기 등을 자유롭게 적어주세요.&#10;참고 이미지는 문의 창에 따로 첨부해 주세요."></textarea></div>

<div class="f"><div class="lab"><span class="num">6</span>얼굴 성형</div>
<div class="chips" id="g_face">
<label><input type="radio" name="face" value="안 함" checked><span>안 함</span></label>
<label><input type="radio" name="face" value="가벼운 개변 (무료)"><span>가벼운 개변 · 무료</span></label>
<label><input type="radio" name="face" value="인상을 크게 바꾸는 개변 (+10,000원)"><span>크게 바꾸는 개변 · +1만원</span></label>
</div></div>

<div class="f"><div class="lab"><span class="num">7</span>방송에 쓸 트래킹 장비</div>
<div class="chips">
<label><input type="radio" name="dev" value="아이폰·아이패드 (Face ID)"><span>아이폰 · 아이패드</span></label>
<label><input type="radio" name="dev" value="웹캠만"><span>웹캠만</span></label>
<label><input type="radio" name="dev" value="아직 모름" checked><span>아직 모름</span></label>
</div></div>

<div class="f"><div class="lab"><span class="num">8</span>희망 완료일<span class="opt">선택</span></div>
<input type="text" id="due" placeholder="예) 11월 20일까지 / 급하지 않아요"></div>

<div class="f"><div class="lab"><span class="num">9</span>그 밖에 궁금한 점<span class="opt">선택</span></div>
<textarea id="etc" placeholder="자유롭게 적어주세요"></textarea></div>

<div class="f"><label class="agree"><input type="checkbox" id="pf"><span><b>샘플 모집 안내를 확인했어요.</b><br>할인가로 진행하는 대신 완성본이 포트폴리오로 공개될 수 있어요.</span></label></div>

<div class="est"><div>예상 견적<small>파츠비는 별도 · 최종 금액은 상담 후 확정</small></div><b id="price">40,000원</b></div>

<div class="btns"><button id="copy">신청서 복사하기</button><button id="reset">초기화</button></div>
<p class="msg" id="msg"></p>
<textarea id="out" readonly></textarea>
</div>
<script>
const $=id=>document.getElementById(id);
const val=n=>(document.querySelector(`input[name=${n}]:checked`)||{}).value||'';
function price(){return 40000+(val('face').includes('+10,000')?10000:0);}
function upd(){ $('price').textContent=price().toLocaleString('ko-KR')+'원'; sendH(); }
document.querySelectorAll('input[type=radio]').forEach(r=>r.addEventListener('change',upd));
function build(){
  const v=id=>$(id).value.trim()||'-';
  return [
    '[햄순찌 커미션 신청서]',
    '1. 방송 닉네임: '+v('nick'),
    '2. 플랫폼 · 채널: '+v('ch'),
    '3. 베이스 모델: '+v('base'),
    '4. 파츠 링크:\n'+v('parts'),
    '5. 색 · 분위기 · 커스텀:\n'+v('custom'),
    '6. 얼굴 성형: '+val('face'),
    '7. 트래킹 장비: '+val('dev'),
    '8. 희망 완료일: '+v('due'),
    '9. 기타: '+v('etc'),
    '포트폴리오 공개 안내 확인: '+($('pf').checked?'O':'X'),
    '예상 견적: '+price().toLocaleString('ko-KR')+'원 (+파츠비)'
  ].join('\n');
}
function msg(t,c){const m=$('msg');m.textContent=t;m.className='msg '+(c||'');}
$('copy').onclick=async()=>{
  if(!$('nick').value.trim()||!$('base').value.trim()){msg('1번 방송 닉네임과 3번 베이스 모델은 꼭 적어주세요','err');return;}
  if(!$('pf').checked){msg('샘플 모집 안내 확인에 체크해 주세요','err');return;}
  const text=build();
  try{await navigator.clipboard.writeText(text);msg('복사됐어요! \'작가에게 문의\'에 붙여넣어 주세요 🎀','ok');$('out').style.display='none';}
  catch(e){const o=$('out');o.value=text;o.style.display='block';o.focus();o.select();
    try{document.execCommand('copy');msg('복사됐어요! \'작가에게 문의\'에 붙여넣어 주세요 🎀','ok');}
    catch(_){msg('아래 내용을 길게 눌러 직접 복사해 주세요','err');}}
  sendH();
};
$('reset').onclick=()=>{document.querySelectorAll('input[type=text],textarea').forEach(e=>e.value='');$('pf').checked=false;
  document.querySelector('input[name=face][value="안 함"]').checked=true;document.querySelector('input[name=dev][value="아직 모름"]').checked=true;
  $('out').style.display='none';msg('');upd();};
function sendH(){ if(parent!==window) parent.postMessage({hamsunzziFormHeight:Math.ceil(document.querySelector('.card').getBoundingClientRect().bottom+window.scrollY+8)},'*'); }
addEventListener('load',()=>{sendH();setTimeout(sendH,400);});
addEventListener('resize',sendH);
if(window.ResizeObserver) new ResizeObserver(sendH).observe(document.body);
upd();
</script>
</body>
</html>
